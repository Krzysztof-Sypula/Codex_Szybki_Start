<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Saper — ćwiczenie z Codex</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <p class="eyebrow">LABORATORIUM LOGIKI / 01</p>
    <h1>Saper<span>.</span></h1>
    <p>81 pól. 10 min. Jeden spokojny ruch naraz.</p>
    <div class="controls">
      <button id="restart">Nowa gra</button>
      <button id="flag-mode" aria-pressed="false">Tryb flagowania: nie</button>
    </div>
    <p id="status" role="status" aria-live="polite"></p>
    <div id="board" aria-label="Plansza Sapera"></div>
    <p class="hint">Kliknij, aby odkryć. Prawy przycisk stawia flagę.<br>Na telefonie użyj trybu flagowania.</p>
  </main>
</body>
</html>
